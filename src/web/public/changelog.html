<!doctype html>
<html lang="fr" data-public>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Changelog · SciensBot</title>
    <link rel="stylesheet" href="/assets/core.css" />
    <script src="/assets/theme.js"></script>
    <script src="/assets/core.js" defer></script>
    <script src="/assets/changelog.js" defer></script>
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main class="page page-narrow" id="main">
      <div class="page-head">
        <h1>📜 Changelog</h1>
        <span class="status-line">Toutes les mises à jour du bot, la plus récente en premier. Sur Discord : <code>/changelog</code>.</span>
      </div>
      <div id="error" class="error-banner" role="alert" hidden></div>
      <div class="card toolbar changelog-toolbar" id="module-filter" hidden></div>
      <nav class="tabs" id="type-filter" role="tablist" aria-label="Filtrer par catégorie" hidden></nav>
      <section id="releases" aria-live="polite"></section>
    </main>
  </body>
</html>
