<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candidatures · SciensBot</title>
    <link rel="stylesheet" href="/assets/core.css" />
    <link rel="stylesheet" href="/m/candidature/assets/candidature.css" />
    <script src="/assets/theme.js"></script>
    <script src="/assets/core.js" defer></script>
    <script src="/m/candidature/assets/candidature.js" defer></script>
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main class="page" id="main">
      <div class="page-head">
        <h1>📨 Candidatures</h1>
        <span class="status-line">Les actions faites ici sont journalisées sur Discord.</span>
      </div>

      <div class="card toolbar">
        <label class="field"><span>Serveur</span><select id="f-guild"></select></label>
      </div>

      <div id="error" class="error-banner" role="alert" hidden></div>
      <div id="empty" class="card empty" hidden>
        Aucun serveur n’a le module Candidatures activé. Active-le avec <code>/modules</code> sur Discord (réservé aux
        administrateurs), puis reviens ici.
      </div>

      <div id="content" hidden>
        <section class="tiles" id="tiles" aria-label="Indicateurs"></section>

        <div class="tabs" id="tabs" role="tablist">
          <button type="button" class="tab-btn" data-tab="settings" role="tab">⚙️ Réglages</button>
          <button type="button" class="tab-btn" data-tab="panels" role="tab">📨 Panels</button>
          <button type="button" class="tab-btn" data-tab="active" role="tab">📬 Candidatures en cours</button>
          <button type="button" class="tab-btn" data-tab="history" role="tab">🗂️ Historique</button>
        </div>

        <div class="tab-panel" id="tab-settings" role="tabpanel">
          <h2 class="section-title">Réglages</h2>
          <section class="card" id="settings-card"></section>

          <h2 class="section-title">Réponses automatiques</h2>
          <section class="card" id="replies-card"></section>
        </div>

        <div class="tab-panel" id="tab-panels" role="tabpanel" hidden>
          <div id="panels-list"></div>
          <div class="card">
            <div class="filters"><button type="button" class="btn btn-primary" id="add-panel">+ Nouveau panel</button></div>
          </div>
        </div>

        <div class="tab-panel" id="tab-active" role="tabpanel" hidden>
          <div id="active-blocks"></div>
        </div>

        <div class="tab-panel" id="tab-history" role="tabpanel" hidden>
          <section class="card" id="history-filters-card"></section>
          <section class="card" id="history-summary-card" hidden></section>
          <section class="card" id="history-card"></section>
        </div>
      </div>
    </main>
  </body>
</html>
